name: Deploy Vue app to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: login-motion-lab/package-lock.json

      - name: Install dependencies
        working-directory: login-motion-lab
        run: npm ci

      - name: Build
        working-directory: login-motion-lab
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: login-motion-lab/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
